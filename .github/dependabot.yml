# Keeps the test tooling (Playwright, Lighthouse, axe) and the workflow actions current.
# Nothing here ships to visitors: the site itself has no runtime dependencies beyond the vendored three.js.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

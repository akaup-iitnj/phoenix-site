name: Build, test, deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group per branch: pull-request runs (Dependabot's included) must never supersede a pending deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests (desktop, tablet, phone)
        run: npm run test:e2e
        env:
          CI: true
      - name: Lighthouse budgets (reported, does not block the deploy)
        run: npm run test:lighthouse
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            playwright-report
            lighthouse-report-*.html
          retention-days: 14
      - name: Enable GitHub Pages for this repository (first run only)
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
